name: aethera-tests

on:
  push:
  pull_request:

jobs:
  gut:
    name: GUT (Godot 4.6.3)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false

      - name: Import project
        run: godot --headless --path game --import --quit

      - name: IP word check
        run: bash scripts/check-ip-words.sh

      - name: Run GUT
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: >
          godot --headless --display-driver headless --audio-driver Dummy
          --path game
          -s res://addons/gut/gut_cmdln.gd
          -gdir=res://tests
          -ginclude_subdirs
          -gexit
